# Pull request validation: builds Release. Publishes nothing.
name: CI

on:
  pull_request:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.x
            11.x

      - name: Install workloads
        run: dotnet workload restore GravatarMobile/GravatarMobile.csproj

      - name: Restore
        run: dotnet restore Gravatar.Mobile.sln

      - name: Build
        run: dotnet build Gravatar.Mobile.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test GravatarMobile.Tests/GravatarMobile.Tests.csproj --configuration Release --no-build
